<!DOCTYPE html>
<html><head></head><body aria-hidden="false">
<div class="center">
	<div class="tools_frame">
		<div class="tools_center" style="height: auto !important;">   
            <div class="tools_block">
                <div class="right_outside">
                    <div class="right_inside">
                        <div id="ClassBlock_1" class="text" style="display: block;">
                            <div class="secretcode_main">
                            	<form>
                                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                    <tbody><tr>
                                        <td width="100" height="50">操作类型：</td>
                                        <td>
                                            <div class="radio">
                                                <input name="codetype" id="decode" value="decode" checked="" type="radio">
                                                <label for="decode">解密</label>
                                            </div>
                                            <div class="radio">
                                                <input name="codetype" id="code" value="code" type="radio">
                                                <label for="code">加密</label>
                                            </div>                                      
                                        </td>
                                    </tr>
                                    <tr>
                                        <td height="70">内容提取码：</td>
                                        <td style="position:relative">
                                        	<div class="checkbox checkbox-primary">
                                                <input name="usePasswords" id="usePasswords" class="styled" value="1" type="checkbox">
                                                <label for="usePasswords">使用</label>
                                            </div>
                                            <input style="display: none;" class="form-control" name="codekey" type="text" id="passwords" maxlength="8">                            
                                        </td>
                                    </tr>
                                    <tr height="70" class="code_block" style="display: table-row;">
                                        <td>明文:</td>
                                        <td>
                                        	<textarea style="resize: vertical; height: 69px;" class="form-control" name="codetext" type="text" id="codetext" rows="3"></textarea>
                                        </td>
                                    </tr>
                                    <tr height="70" class="decode_block" style="display: none;">
                                        <td>秘钥:</td>
                                        <td>
											<input class="form-control" name="codekey" type="text" id="codekey" maxlength="20">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td></td>
                                        <td>
                                            <input class="btn btn-success" id="subCode" value="加密" type="button">
                                            <div id="callback"></div>
                                        </td>
                                    </tr>
                                </tbody></table>
                                </form>
							</div>
                        </div>
                    </div>
                </div>
            </div>	  
		</div>
	  
	</div>
</div>
</body></html>
